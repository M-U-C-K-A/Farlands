.hl{animation:hl 6s ease-out infinite}
.hlb{animation:hlb 12s ease-out infinite}
@keyframes hl{0%{stroke:#ffd866;stroke-width:2}14%,100%{stroke:#2c3b5a;stroke-width:1}}
@keyframes hlb{0%{stroke:#7ccf4a;stroke-width:2}9%,100%{stroke:#2c3b5a;stroke-width:1}}
</style>
