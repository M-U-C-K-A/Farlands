<title id="title">One frame of Farlands</title>
<desc id="desc">Application::mainLoop() — single-threaded today; world work only runs when the player enters a new chunk.</desc>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
