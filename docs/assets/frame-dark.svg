<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1180 590" width="1180" height="590" role="img" aria-labelledby="title desc">
<title id="title">One frame of Farlands</title>
<desc id="desc">The main thread streams and records, worker pools build chunks and far-terrain tiles, the GPU runs seven HDR stages.</desc>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.h1{font-size:22px;font-weight:700;fill:#e6edf3}
.sub{font-size:13.5px;fill:#9198a1}
.lbl{font-size:13px;fill:#e6edf3}
.small{font-size:11.5px;fill:#9198a1}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.flow{stroke-dasharray:5 6;animation:dash 1s linear infinite}
@keyframes dash{from{stroke-dashoffset:22}to{stroke-dashoffset:0}}
.hl{animation:hl 5s ease-out infinite}
.hlw{animation:hl 2s ease-out infinite}
@keyframes hl{0%{stroke:#e3b341;stroke-width:2}16%,100%{stroke:#3d444d;stroke-width:1}}
.job{animation:job 3s linear infinite}
@keyframes job{0%{transform:translateX(0);opacity:0}12%{opacity:1}85%{opacity:1}100%{transform:translateX(52px);opacity:0}}
</style>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ab7df8"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker></defs>
<text x="0" y="24" class="sans h1">One frame of Farlands</text>
<text x="0" y="48" class="sans sub">The main thread streams and records, worker pools build chunks and far-terrain tiles, the GPU runs seven HDR stages.</text>
<g transform="translate(0 30)"><text x="0" y="84" class="mono" font-size="10.5" letter-spacing="1.2" fill="#656c76">MAIN THREAD</text><path d="M1002.0,96 V74 H158.0 V94" fill="none" stroke="#59636e" stroke-width="1.6" class="flow" marker-end="url(#ah0)"/><text x="550.0" y="69" text-anchor="middle" class="mono" font-size="10" fill="#656c76">next frame</text><path d="M196,133.0 H224" fill="none" stroke="#59636e" stroke-width="1.6" class="flow" marker-end="url(#ah0)"/><path d="M422,133.0 H450" fill="none" stroke="#59636e" stroke-width="1.6" class="flow" marker-end="url(#ah0)"/><path d="M648,133.0 H676" fill="none" stroke="#59636e" stroke-width="1.6" class="flow" marker-end="url(#ah0)"/><path d="M874,133.0 H902" fill="none" stroke="#59636e" stroke-width="1.6" class="flow" marker-end="url(#ah0)"/><text x="0" y="254" class="mono" font-size="10.5" letter-spacing="1.2" fill="#656c76">WORKER THREADS</text><rect x="0" y="268" width="236" height="74" rx="10" fill="#151b23" stroke="#3d444d" stroke-dasharray="4 3"/><text x="15" y="293" class="sans" font-size="14" font-weight="700" fill="#e6edf3">JobSystem</text><text x="15" y="313" class="mono" font-size="11" fill="#9198a1">hw − 2 threads, by distance</text><g class="job" style="animation-delay:0.00s"><rect x="15" y="320" width="44" height="14" rx="3" fill="#3fb950" fill-opacity=".18" stroke="#3fb950"/><text x="37" y="331" text-anchor="middle" class="mono" font-size="9" fill="#e6edf3">d 0.0</text></g><g class="job" style="animation-delay:-0.75s"><rect x="67" y="320" width="44" height="14" rx="3" fill="#ab7df8" fill-opacity=".18" stroke="#ab7df8"/><text x="89" y="331" text-anchor="middle" class="mono" font-size="9" fill="#e6edf3">d 0.5</text></g><g class="job" style="animation-delay:-1.50s"><rect x="119" y="320" width="44" height="14" rx="3" fill="#3fb950" fill-opacity=".18" stroke="#3fb950"/><text x="141" y="331" text-anchor="middle" class="mono" font-size="9" fill="#e6edf3">d 1.0</text></g><g class="job" style="animation-delay:-2.25s"><rect x="171" y="320" width="44" height="14" rx="3" fill="#3fb950" fill-opacity=".18" stroke="#3fb950"/><text x="193" y="331" text-anchor="middle" class="mono" font-size="9" fill="#e6edf3">d 1.4</text></g><rect x="276" y="268" width="250" height="74" rx="10" fill="#151b23" stroke="#3d444d" class="hlw" style="animation-delay:0.30s"/><rect x="276" y="280" width="3" height="50" rx="1.5" fill="#3fb950"/><text x="291" y="293" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Generate chunk</text><text x="291" y="313" class="mono" font-size="11" fill="#9198a1">relief · biomes · trees</text><text x="291" y="329" class="mono" font-size="11" fill="#9198a1">plants · surface · tints</text><rect x="566" y="268" width="270" height="74" rx="10" fill="#151b23" stroke="#3d444d" class="hlw" style="animation-delay:1.30s"/><rect x="566" y="280" width="3" height="50" rx="1.5" fill="#ab7df8"/><text x="581" y="293" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Mesh chunk</text><text x="581" y="313" class="mono" font-size="11" fill="#9198a1">3×3 immutable neighbours</text><text x="581" y="329" class="mono" font-size="11" fill="#9198a1">AO · opaque/cutout/water</text><rect x="878" y="268" width="262" height="74" rx="10" fill="#151b23" stroke="#3d444d" class="hlw" style="animation-delay:0.80s" stroke-dasharray="4 3"/><rect x="878" y="280" width="3" height="50" rx="1.5" fill="#39c5cf"/><text x="893" y="293" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Far terrain tile</text><text x="893" y="313" class="mono" font-size="11" fill="#9198a1">LodTerrain · 3 threads</text><text x="893" y="329" class="mono" font-size="11" fill="#9198a1">256 blocks, step 4–16</text><path d="M236,305.0 H274" fill="none" stroke="#59636e" stroke-width="1.6" class="flow" marker-end="url(#ah0)"/><path d="M526,305.0 H564" fill="none" stroke="#59636e" stroke-width="1.6" class="flow" marker-end="url(#ah0)"/><text x="546.0" y="297.0" text-anchor="middle" class="mono" font-size="10" fill="#656c76">8 nbrs</text><path d="M284.0,170 V238 H118.0 V266" fill="none" stroke="#3fb950" stroke-width="1.6" class="flow c" marker-end="url(#ah1)"/><text x="126.0" y="232" text-anchor="start" class="mono" font-size="10" fill="#3fb950">submit</text><path d="M326,268 V250 H344.0 V172" fill="none" stroke="#3fb950" stroke-width="1.6" class="flow c" marker-end="url(#ah1)"/><text x="352.0" y="244" text-anchor="start" class="mono" font-size="10" fill="#3fb950">chunk</text><path d="M616,268 V222 H530.0 V172" fill="none" stroke="#ab7df8" stroke-width="1.6" class="flow c" marker-end="url(#ah2)"/><text x="522.0" y="216" text-anchor="end" class="mono" font-size="10" fill="#ab7df8">mesh</text><path d="M938,268 V234 H570.0 V172" fill="none" stroke="#39c5cf" stroke-width="1.6" class="flow c" marker-end="url(#ah3)"/><text x="946" y="228" text-anchor="start" class="mono" font-size="10" fill="#39c5cf">LOD tile</text><text x="0" y="426" class="mono" font-size="10.5" letter-spacing="1.2" fill="#656c76">GPU · HDR PASSES</text><path d="M1100,133.0 H1166 V406 H118 V438" fill="none" stroke="#59636e" stroke-width="1.6" class="flow" marker-end="url(#ah0)"/><path d="M148,477.0 H160" fill="none" stroke="#59636e" stroke-width="1.6" class="flow" marker-end="url(#ah0)"/><path d="M310,477.0 H322" fill="none" stroke="#59636e" stroke-width="1.6" class="flow" marker-end="url(#ah0)"/><path d="M472,477.0 H484" fill="none" stroke="#59636e" stroke-width="1.6" class="flow" marker-end="url(#ah0)"/><path d="M634,477.0 H646" fill="none" stroke="#59636e" stroke-width="1.6" class="flow" marker-end="url(#ah0)"/><path d="M796,477.0 H808" fill="none" stroke="#59636e" stroke-width="1.6" class="flow" marker-end="url(#ah0)"/><path d="M958,477.0 H970" fill="none" stroke="#59636e" stroke-width="1.6" class="flow" marker-end="url(#ah0)"/><circle r="5" fill="#e3b341"><animateMotion dur="5s" repeatCount="indefinite" path="M98.0,133.0 H1002.0 V74 H98.0 Z"/></circle><circle r="4.5" fill="#79c0ff" opacity="0"><animateMotion dur="5s" repeatCount="indefinite" path="M74.0,477.0 H1046.0" keyPoints="0;0;1;1" keyTimes="0;.42;.95;1" calcMode="linear"/><animate attributeName="opacity" dur="5s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.41;.43;.94;1"/></circle><rect x="0" y="96" width="196" height="74" rx="10" fill="#151b23" stroke="#3d444d" class="hl" style="animation-delay:-0.15s"/><rect x="0" y="108" width="3" height="50" rx="1.5" fill="#4493f8"/><text x="15" y="121" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Input &amp; player</text><text x="15" y="141" class="mono" font-size="11" fill="#9198a1">GLFW · physics · AABB</text><text x="15" y="157" class="mono" font-size="11" fill="#9198a1">swimming, sub-steps</text><rect x="226" y="96" width="196" height="74" rx="10" fill="#151b23" stroke="#3d444d" class="hl" style="animation-delay:0.44s"/><rect x="226" y="108" width="3" height="50" rx="1.5" fill="#3fb950"/><text x="241" y="121" class="sans" font-size="14" font-weight="700" fill="#e6edf3">World &amp; LOD update</text><text x="241" y="141" class="mono" font-size="11" fill="#9198a1">chunk jobs, nearest first</text><text x="241" y="157" class="mono" font-size="11" fill="#9198a1">far-terrain tiles</text><rect x="452" y="96" width="196" height="74" rx="10" fill="#151b23" stroke="#3d444d" class="hl" style="animation-delay:1.02s"/><rect x="452" y="108" width="3" height="50" rx="1.5" fill="#3fb950"/><text x="467" y="121" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Upload</text><text x="467" y="141" class="mono" font-size="11" fill="#9198a1">≤ 48 chunk meshes / frame</text><text x="467" y="157" class="mono" font-size="11" fill="#9198a1">LOD tiles, own buffers</text><rect x="678" y="96" width="196" height="74" rx="10" fill="#151b23" stroke="#3d444d" class="hl" style="animation-delay:1.61s"/><rect x="678" y="108" width="3" height="50" rx="1.5" fill="#4493f8"/><text x="693" y="121" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Leaves &amp; culling</text><text x="693" y="141" class="mono" font-size="11" fill="#9198a1">falling-leaf particles</text><text x="693" y="157" class="mono" font-size="11" fill="#9198a1">frustum · sun · shadows</text><rect x="904" y="96" width="196" height="74" rx="10" fill="#151b23" stroke="#3d444d" class="hl" style="animation-delay:2.20s"/><rect x="904" y="108" width="3" height="50" rx="1.5" fill="#f85149"/><text x="919" y="121" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Record &amp; submit</text><text x="919" y="141" class="mono" font-size="11" fill="#9198a1">one command buffer</text><text x="919" y="157" class="mono" font-size="11" fill="#9198a1">2 frames in flight</text><rect x="0" y="440" width="148" height="74" rx="10" fill="#151b23" stroke="#3d444d" class="hl" style="animation-delay:2.10s"/><rect x="0" y="452" width="3" height="50" rx="1.5" fill="#79c0ff"/><text x="15" y="465" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Sky</text><text x="15" y="485" class="mono" font-size="11" fill="#9198a1">LUT + env map</text><text x="15" y="501" class="mono" font-size="11" fill="#9198a1">clouds at ½ res</text><rect x="162" y="440" width="148" height="74" rx="10" fill="#151b23" stroke="#3d444d" class="hl" style="animation-delay:2.55s"/><rect x="162" y="452" width="3" height="50" rx="1.5" fill="#656c76"/><text x="177" y="465" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Shadows</text><text x="177" y="485" class="mono" font-size="11" fill="#9198a1">4096² sun map</text><text x="177" y="501" class="mono" font-size="11" fill="#9198a1">cached · PCF</text><rect x="324" y="440" width="148" height="74" rx="10" fill="#151b23" stroke="#3d444d" class="hl" style="animation-delay:3.00s"/><rect x="324" y="452" width="3" height="50" rx="1.5" fill="#3fb950"/><text x="339" y="465" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Scene</text><text x="339" y="485" class="mono" font-size="11" fill="#9198a1">chunks · far LOD</text><text x="339" y="501" class="mono" font-size="11" fill="#9198a1">leaves · sky</text><rect x="486" y="440" width="148" height="74" rx="10" fill="#151b23" stroke="#3d444d" class="hl" style="animation-delay:3.45s"/><rect x="486" y="452" width="3" height="50" rx="1.5" fill="#4493f8"/><text x="501" y="465" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Water</text><text x="501" y="485" class="mono" font-size="11" fill="#9198a1">SSR · refraction</text><text x="501" y="501" class="mono" font-size="11" fill="#9198a1">absorption</text><rect x="648" y="440" width="148" height="74" rx="10" fill="#151b23" stroke="#3d444d" class="hl" style="animation-delay:3.90s"/><rect x="648" y="452" width="3" height="50" rx="1.5" fill="#ab7df8"/><text x="663" y="465" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Volumetric fog</text><text x="663" y="485" class="mono" font-size="11" fill="#9198a1">½ res · 24 steps</text><text x="663" y="501" class="mono" font-size="11" fill="#9198a1">lit by shadows</text><rect x="810" y="440" width="148" height="74" rx="10" fill="#151b23" stroke="#3d444d" class="hl" style="animation-delay:4.35s"/><rect x="810" y="452" width="3" height="50" rx="1.5" fill="#f0883e"/><text x="825" y="465" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Bloom</text><text x="825" y="485" class="mono" font-size="11" fill="#9198a1">5 mips · ½ res</text><text x="825" y="501" class="mono" font-size="11" fill="#9198a1">down + up</text><rect x="972" y="440" width="148" height="74" rx="10" fill="#151b23" stroke="#3d444d" class="hl" style="animation-delay:4.80s"/><rect x="972" y="452" width="3" height="50" rx="1.5" fill="#f85149"/><text x="987" y="465" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Composite</text><text x="987" y="485" class="mono" font-size="11" fill="#9198a1">god rays · ACES</text><text x="987" y="501" class="mono" font-size="11" fill="#9198a1">grading · ImGui</text></g>
</svg>
