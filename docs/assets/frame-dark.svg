eight="50" rx="1.5" fill="#f85149"/><text x="920" y="121" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Record &amp; submit</text><text x="920" y="141" class="mono" font-size="11" fill="#9198a1">one command buffer</text><text x="920" y="157" class="mono" font-size="11" fill="#9198a1">2 frames in flight</text><rect x="0" y="430" width="170" height="74" rx="10" fill="#151b23" stroke="#3d444d" class="hl" style="animation-delay:2.10s"/><rect x="0" y="442" width="3" height="50" rx="1.5" fill="#79c0ff"/><text x="16" y="455" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Sky</text><text x="16" y="475" class="mono" font-size="11" fill="#9198a1">LUT 256×128 · env</text><text x="16" y="491" class="mono" font-size="11" fill="#9198a1">clouds at ½ res</text><rect x="186" y="430" width="170" height="74" rx="10" fill="#151b23" stroke="#3d444d" class="hl" style="animation-delay:2.63s"/><rect x="186" y="442" width="3" height="50" rx="1.5" fill="#656c76"/><text x="202" y="455" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Shadows</text><text x="202" y="475" class="mono" font-size="11" fill="#9198a1">4096² sun map</text><text x="202" y="491" class="mono" font-size="11" fill="#9198a1">cached, PCF</text><rect x="372" y="430" width="170" height="74" rx="10" fill="#151b23" stroke="#3d444d" class="hl" style="animation-delay:3.16s"/><rect x="372" y="442" width="3" height="50" rx="1.5" fill="#3fb950"/><text x="388" y="455" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Scene</text><text x="388" y="475" class="mono" font-size="11" fill="#9198a1">opaque · cutout</text><text x="388" y="491" class="mono" font-size="11" fill="#9198a1">+ sky, reverse-Z</text><rect x="558" y="430" width="170" height="74" rx="10" fill="#151b23" stroke="#3d444d" class="hl" style="animation-delay:3.69s"/><rect x="558" y="442" width="3" height="50" rx="1.5" fill="#4493f8"/><text x="574" y="455" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Water</text><text x="574" y="475" class="mono" font-size="11" fill="#9198a1">SSR · refraction</text><text x="574" y="491" class="mono" font-size="11" fill="#9198a1">absorption, glint</text><rect x="744" y="430" width="170" height="74" rx="10" fill="#151b23" stroke="#3d444d" class="hl" style="animation-delay:4.22s"/><rect x="744" y="442" width="3" height="50" rx="1.5" fill="#f0883e"/><text x="760" y="455" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Bloom</text><text x="760" y="475" class="mono" font-size="11" fill="#9198a1">5 mips at ½ res</text><text x="760" y="491" class="mono" font-size="11" fill="#9198a1">down + up</text><rect x="930" y="430" width="170" height="74" rx="10" fill="#151b23" stroke="#3d444d" class="hl" style="animation-delay:4.75s"/><rect x="930" y="442" width="3" height="50" rx="1.5" fill="#f85149"/><text x="946" y="455" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Composite</text><text x="946" y="475" class="mono" font-size="11" fill="#9198a1">god rays · ACES</text><text x="946" y="491" class="mono" font-size="11" fill="#9198a1">ImGui → swapchain</text></g>
