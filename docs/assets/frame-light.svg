eight="50" rx="1.5" fill="#cf222e"/><text x="920" y="121" class="sans" font-size="14" font-weight="700" fill="#1f2328">Record &amp; submit</text><text x="920" y="141" class="mono" font-size="11" fill="#59636e">one command buffer</text><text x="920" y="157" class="mono" font-size="11" fill="#59636e">2 frames in flight</text><rect x="0" y="430" width="170" height="74" rx="10" fill="#f6f8fa" stroke="#d1d9e0" class="hl" style="animation-delay:2.10s"/><rect x="0" y="442" width="3" height="50" rx="1.5" fill="#218bff"/><text x="16" y="455" class="sans" font-size="14" font-weight="700" fill="#1f2328">Sky</text><text x="16" y="475" class="mono" font-size="11" fill="#59636e">LUT 256×128 · env</text><text x="16" y="491" class="mono" font-size="11" fill="#59636e">clouds at ½ res</text><rect x="186" y="430" width="170" height="74" rx="10" fill="#f6f8fa" stroke="#d1d9e0" class="hl" style="animation-delay:2.63s"/><rect x="186" y="442" width="3" height="50" rx="1.5" fill="#818b98"/><text x="202" y="455" class="sans" font-size="14" font-weight="700" fill="#1f2328">Shadows</text><text x="202" y="475" class="mono" font-size="11" fill="#59636e">4096² sun map</text><text x="202" y="491" class="mono" font-size="11" fill="#59636e">cached, PCF</text><rect x="372" y="430" width="170" height="74" rx="10" fill="#f6f8fa" stroke="#d1d9e0" class="hl" style="animation-delay:3.16s"/><rect x="372" y="442" width="3" height="50" rx="1.5" fill="#1a7f37"/><text x="388" y="455" class="sans" font-size="14" font-weight="700" fill="#1f2328">Scene</text><text x="388" y="475" class="mono" font-size="11" fill="#59636e">opaque · cutout</text><text x="388" y="491" class="mono" font-size="11" fill="#59636e">+ sky, reverse-Z</text><rect x="558" y="430" width="170" height="74" rx="10" fill="#f6f8fa" stroke="#d1d9e0" class="hl" style="animation-delay:3.69s"/><rect x="558" y="442" width="3" height="50" rx="1.5" fill="#0969da"/><text x="574" y="455" class="sans" font-size="14" font-weight="700" fill="#1f2328">Water</text><text x="574" y="475" class="mono" font-size="11" fill="#59636e">SSR · refraction</text><text x="574" y="491" class="mono" font-size="11" fill="#59636e">absorption, glint</text><rect x="744" y="430" width="170" height="74" rx="10" fill="#f6f8fa" stroke="#d1d9e0" class="hl" style="animation-delay:4.22s"/><rect x="744" y="442" width="3" height="50" rx="1.5" fill="#bc4c00"/><text x="760" y="455" class="sans" font-size="14" font-weight="700" fill="#1f2328">Bloom</text><text x="760" y="475" class="mono" font-size="11" fill="#59636e">5 mips at ½ res</text><text x="760" y="491" class="mono" font-size="11" fill="#59636e">down + up</text><rect x="930" y="430" width="170" height="74" rx="10" fill="#f6f8fa" stroke="#d1d9e0" class="hl" style="animation-delay:4.75s"/><rect x="930" y="442" width="3" height="50" rx="1.5" fill="#cf222e"/><text x="946" y="455" class="sans" font-size="14" font-weight="700" fill="#1f2328">Composite</text><text x="946" y="475" class="mono" font-size="11" fill="#59636e">god rays · ACES</text><text x="946" y="491" class="mono" font-size="11" fill="#59636e">ImGui → swapchain</text></g>
